services:
  smartsearch-mcp:
    build:
      context: .
      target: runtime
      args:
        SMARTSEARCH_VERSION: "0.1.14-beta.8"
        SMARTSEARCH_COMMIT: "667c465d0f6ea16a423f03c434f94e21505d3595"
        FASTMCP_VERSION: "3.4.4"
    image: local/smartsearch-mcp:0.1.14-beta.8-fastmcp3.4.4
    container_name: smartsearch-mcp
    restart: unless-stopped
    init: true
    user: "1000:1001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      ANYSEARCH_API_KEY: "${ANYSEARCH_API_KEY:-}"
      ANYSEARCH_API_URL: "${ANYSEARCH_API_URL:-}"
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY:-}"
      EXA_API_KEY: "${EXA_API_KEY:-}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      FIRECRAWL_API_URL: "${FIRECRAWL_API_URL:-}"
      JINA_API_KEY: "${JINA_API_KEY:-}"
      JINA_READER_API_URL: "${JINA_READER_API_URL:-}"
      OPENAI_COMPATIBLE_API_KEY: "${OPENAI_COMPATIBLE_API_KEY:-}"
      # The root env value is host-local (127.0.0.1). Keep the stdio
      # configuration untouched and translate only the remote container.
      OPENAI_COMPATIBLE_API_URL: "http://192.168.31.201:3000/v1"
      OPENAI_COMPATIBLE_MODEL: "${OPENAI_COMPATIBLE_MODEL:-}"
      OPENAI_COMPATIBLE_STREAM: "${OPENAI_COMPATIBLE_STREAM:-false}"
      SMART_SEARCH_CONFIG_DIR: "/data/config"
      SMART_SEARCH_DEBUG: "false"
      SMART_SEARCH_FALLBACK_MODE: "${SMART_SEARCH_FALLBACK_MODE:-auto}"
      SMART_SEARCH_INTENT_ROUTER: "${SMART_SEARCH_INTENT_ROUTER:-rules}"
      SMART_SEARCH_LOG_TO_FILE: "false"
      SMART_SEARCH_MINIMUM_PROFILE: "${SMART_SEARCH_MINIMUM_PROFILE:-standard}"
      SMART_SEARCH_VALIDATION_LEVEL: "${SMART_SEARCH_VALIDATION_LEVEL:-balanced}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      TAVILY_API_URL: "${TAVILY_API_URL:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      XAI_API_URL: "http://192.168.31.201:8317/v1"
      XAI_MODEL: "${XAI_MODEL:-}"
      ZHIPU_API_KEY: "${ZHIPU_API_KEY:-}"
      ZHIPU_API_URL: "${ZHIPU_API_URL:-}"
      ZHIPU_MCP_API_KEY: "${ZHIPU_MCP_API_KEY:-}"
      ZHIPU_MCP_READER_API_URL: "${ZHIPU_MCP_READER_API_URL:-}"
      ZHIPU_MCP_SEARCH_API_URL: "${ZHIPU_MCP_SEARCH_API_URL:-}"
      ZHIPU_MCP_ZREAD_API_URL: "${ZHIPU_MCP_ZREAD_API_URL:-}"
      SMARTSEARCH_REMOTE_OIDC_CLIENT_ID: "${SMARTSEARCH_REMOTE_OIDC_CLIENT_ID:-smartsearch-mcp}"
      SMARTSEARCH_REMOTE_OIDC_CLIENT_SECRET: "${SMARTSEARCH_REMOTE_OIDC_CLIENT_SECRET:?SMARTSEARCH_REMOTE_OIDC_CLIENT_SECRET is required}"
      SMARTSEARCH_REMOTE_JWT_SIGNING_KEY: "${SMARTSEARCH_REMOTE_JWT_SIGNING_KEY:?SMARTSEARCH_REMOTE_JWT_SIGNING_KEY is required}"
      SMARTSEARCH_REMOTE_STORAGE_ENCRYPTION_KEY: "${SMARTSEARCH_REMOTE_STORAGE_ENCRYPTION_KEY:?SMARTSEARCH_REMOTE_STORAGE_ENCRYPTION_KEY is required}"
      SMARTSEARCH_REMOTE_PUBLIC_BASE_URL: "https://smartsearch-mcp-home.172906573.xyz"
      SMARTSEARCH_REMOTE_OIDC_DISCOVERY_URL: "https://authelia-home.172906573.xyz/.well-known/openid-configuration"
      SMARTSEARCH_REMOTE_AUTHORIZED_USERNAME: "yuwk"
      SMARTSEARCH_REMOTE_DATA_DIR: "/data"
      SMARTSEARCH_REMOTE_RETENTION_DAYS: "30"
      HTTP_PROXY: "http://192.168.31.201:7890"
      HTTPS_PROXY: "http://192.168.31.201:7890"
      ALL_PROXY: "http://192.168.31.201:7890"
      NO_PROXY: "localhost,127.0.0.1,::1,smartsearch-mcp,nginx-proxy-manager,authelia,192.168.31.201,.172906573.xyz"
    extra_hosts:
      - "authelia-home.172906573.xyz:192.168.31.201"
    volumes:
      - /vol2/1000/Docker/smartsearch-mcp/data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - gateway_net

networks:
  gateway_net:
    external: true
    name: gateway_net
